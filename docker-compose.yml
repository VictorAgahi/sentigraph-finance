version: '3.8'

services:
  redis:
    image: ghcr.io/dragonflydb/dragonfly
    container_name: sentigraph-dragonfly
    ports:
      - "6379:6379"
    restart: always

  timescale:
    image: timescale/timescaledb-ha:pg15
    container_name: sentigraph-timescale
    environment:
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    restart: always

  ollama-bridge:
    image: alpine/socat
    container_name: sentigraph-ollama-bridge
    command: tcp-listen:11434,fork,reuseaddr tcp:host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  harvester-btc:
    build:
      context: ./sentigraph-harvester
    image: sentigraph-harvester
    container_name: sentigraph-harvester-btc
    environment:
      - REDIS_URL=redis://redis:6379
      - BINANCE_WS_URL=wss://fstream.binance.com/stream?streams=btcusdt@ticker/btcusdt@depth20@100ms/btcusdt@forceOrder
      - SYMBOL=btc
      - RUST_LOG=debug
    depends_on:
      - redis
    restart: always

  harvester-eth:
    build:
      context: ./sentigraph-harvester
    image: sentigraph-harvester
    container_name: sentigraph-harvester-eth
    environment:
      - REDIS_URL=redis://redis:6379
      - BINANCE_WS_URL=wss://fstream.binance.com/stream?streams=ethusdt@ticker/ethusdt@depth20@100ms/ethusdt@forceOrder
      - SYMBOL=eth
      - RUST_LOG=debug
    depends_on:
      - redis
    restart: always

  harvester-sol:
    build:
      context: ./sentigraph-harvester
    image: sentigraph-harvester
    container_name: sentigraph-harvester-sol
    environment:
      - REDIS_URL=redis://redis:6379
      - BINANCE_WS_URL=wss://fstream.binance.com/stream?streams=solusdt@ticker/solusdt@depth20@100ms/solusdt@forceOrder
      - SYMBOL=sol
      - RUST_LOG=debug
    depends_on:
      - redis
    restart: always

  analyst:
    build:
      context: ./sentigraph-analyst
    image: sentigraph-analyst
    container_name: sentigraph-analyst
    ports:
      - "8080:8080"
    environment:
      - REDIS_URL=redis:6379
      - OLLAMA_URL=http://ollama-bridge:11434/api/generate
      - DATABASE_URL=postgres://postgres:password@timescale:5432/postgres
      - PORT=8080
    depends_on:
      - redis
      - timescale
      - ollama-bridge
    restart: always

  scout:
    build:
      context: ./sentigraph-scout
    image: sentigraph-scout
    container_name: sentigraph-scout
    environment:
      - REDIS_URL=redis:6379
    depends_on:
      - redis
    restart: always

  dashboard:
    build:
      context: ./sentigraph-dashboard
    image: sentigraph-dashboard
    container_name: sentigraph-dashboard
    ports:
      - "3000:3000"
    restart: always

volumes:
  timescale_data:
